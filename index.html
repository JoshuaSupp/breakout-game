<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakout Game</title>
    <!-- Poki SDK -->
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #gameContainer {
            border: 2px solid #fff;
            background-color: #111;
            position: relative;
            max-width: 100vw;
            max-height: 100vh;
            aspect-ratio: 4/3;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 18px;
            z-index: 2000;
            user-select: none;
            pointer-events: auto;
        }

        /* Hamburger Menu */
        #menuBtn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: white;
            font-size: 30px;
            cursor: pointer;
            z-index: 2002;
            padding: 5px;
            line-height: 1;
        }

        #sideMenu {
            position: fixed;
            top: 0;
            right: -300px;
            width: 300px;
            height: 100vh;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            border-left: 1px solid #333;
            transition: right 0.3s ease;
            z-index: 2001;
            padding: 60px 20px 20px;
            color: white;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            overflow-y: auto;
        }

        #sideMenu.open {
            right: 0;
        }

        .menu-section {
            margin-bottom: 30px;
        }

        .menu-title {
            font-size: 1.2em;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            margin-bottom: 15px;
            color: #1099bb;
            font-weight: bold;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #1099bb;
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        /* History List */
        #historyList {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
        }

        .history-win {
            border-left: 3px solid #4caf50;
        }

        .history-loss {
            border-left: 3px solid #f44336;
        }
        
        /* Responsive font sizing */
        @media (max-width: 768px) {
            #ui {
                font-size: 14px;
                top: 8px;
                left: 8px;
            }
        }
        
        @media (max-width: 480px) {
            #ui {
                font-size: 12px;
                top: 5px;
                left: 5px;
            }
        }
        
        /* Exit button styling */
        .exit-button {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 0.5em 1em;
            font-size: 0.9em;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 0.5em;
            transition: background-color 0.3s ease, transform 0.2s ease;
            font-weight: bold;
            pointer-events: auto;
            position: relative;
            z-index: 2001;
        }
        
        .exit-button:hover {
            background-color: #c82333;
            transform: translateY(-1px);
        }
        
        .exit-button:active {
            transform: translateY(0);
        }
        
        @media (max-width: 768px) {
            .exit-button {
                font-size: 0.8em;
                padding: 0.4em 0.8em;
            }
        }
        
        @media (max-width: 480px) {
            .exit-button {
                font-size: 0.7em;
                padding: 0.3em 0.6em;
            }
        }
        
        /* Ensure canvas scales properly */
        canvas {
            max-width: 100%;
            max-height: 100%;
            display: block;
            touch-action: none; /* Prevent scrolling and improve touch responsiveness */
            user-select: none; /* Prevent text selection */
            -webkit-user-select: none;
            -webkit-touch-callout: none; /* Disable callout on iOS */
        }
    </style>
</head>
<body>
    <div id="ui">
        <div>Score: <span id="score">0</span></div>
        <div>Lives: <span id="lives">3</span></div>
        <div>Username: <span id="username"></span></div>
        <button id="exitBtn" class="exit-button">Exit Game</button>
    </div>
    
    <button id="menuBtn">☰</button>
    
    <div id="sideMenu">
        <div class="menu-section">
            <div class="menu-title">Settings</div>
            <div class="setting-row">
                <span>Music</span>
                <label class="switch">
                    <input type="checkbox" id="musicToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-row">
                <span>Sound Effects</span>
                <label class="switch">
                    <input type="checkbox" id="soundToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-row">
                <span>Night Mode</span>
                <label class="switch">
                    <input type="checkbox" id="bgToggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
        
        <div class="menu-section">
            <div class="menu-title">Game History</div>
            <ul id="historyList">
                <!-- History items will be added here -->
            </ul>
        </div>
    </div>

    <div id="gameContainer"></div>
    <!-- Username popup -->
    <div id="usernamePopup" class="popup show">
        <div class="popup-content">
            <h2>Welcome to Breakout!</h2>
            <p>Please enter your username:</p>
            <input type="text" id="usernameInput" placeholder="Enter your username" maxlength="20" />
            <p>Select difficulty:</p>
            <select id="difficultySelect" class="difficulty-select">
                <option value="easy">Easy</option>
                <option value="medium" selected>Medium</option>
                <option value="hard">Hard</option>
            </select>
            <button id="startGameBtn">Start Game</button>
        </div>
    </div>
    
    <!-- Popup overlay -->
    <div id="gamePopup" class="popup">
        <div class="popup-content">
            <h2 id="popupTitle"></h2>
            <p id="popupMessage"></p>
            <button id="popupOkBtn">OK</button>
        </div>
    </div>

    <!-- Exit Confirmation Popup -->
    <div id="exitConfirmPopup" class="popup">
        <div class="popup-content">
            <h2>Exit Game?</h2>
            <p>Are you sure you want to exit? Your progress will be lost.</p>
            <div class="popup-buttons">
                <button id="exitConfirmYesBtn" class="confirm-btn yes-btn">Yes, Exit</button>
                <button id="exitConfirmNoBtn" class="confirm-btn no-btn">Cancel</button>
            </div>
        </div>
    </div>
    <script type="module">
        import { BreakoutGame } from './src/game.ts';
        
        console.log('Script module started');
        const game = new BreakoutGame();
        const difficultySelect = document.getElementById('difficultySelect');
        let selectedDifficulty = 'medium'; 
        
        if (difficultySelect) {
            setTimeout(() => {
                selectedDifficulty = difficultySelect.value;
            }, 100);   
            difficultySelect.addEventListener('change', () => {
                selectedDifficulty = difficultySelect.value;
            });
        }
        const startGameBtn = document.getElementById('startGameBtn');
        const usernameInput = document.getElementById('usernameInput');
        function startGame() {
            const username = usernameInput.value.trim();
            const actualDifficulty = difficultySelect.value;
            if (username) {
                game.username = username;
                game.setDifficulty(actualDifficulty);
                const usernamePopup = document.getElementById('usernamePopup');
                if (usernamePopup) {
                    usernamePopup.classList.remove('show');
                }
                game.gameState = 'playing';
                if (game.app && game.app.ticker) {
                    game.app.ticker.start();
                }    
                game.initializeGame();
                game.updateUI(); 
            } else {
                alert('Please enter a username!');
            }
        } 
        if (startGameBtn) {
            startGameBtn.addEventListener('click', startGame);
        }
        if (usernameInput) {
            usernameInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    startGame();
                }
            });
        }
        const exitBtn = document.getElementById('exitBtn');
        const exitConfirmPopup = document.getElementById('exitConfirmPopup');
        const exitConfirmYesBtn = document.getElementById('exitConfirmYesBtn');
        const exitConfirmNoBtn = document.getElementById('exitConfirmNoBtn');

        if (exitBtn && exitConfirmPopup && exitConfirmYesBtn && exitConfirmNoBtn) {
            exitBtn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                exitConfirmPopup.classList.add('show');
            });

            // Handle Yes click
            exitConfirmYesBtn.addEventListener('click', () => {
                exitConfirmPopup.classList.remove('show');
                
                if (game.app && game.app.ticker) {
                    game.app.ticker.stop();
                }
                
                // Reset game state
                game.gameState = 'start';
                game.score = 0;
                game.lives = 3;
                
                // Show the username popup again
                const usernamePopup = document.getElementById('usernamePopup');
                if (usernamePopup) {
                    usernamePopup.classList.remove('hide');
                    usernamePopup.classList.add('show');
                }
                
                // Reset the game
                game.resetGame();
                
                // Force state back to start
                game.gameState = 'start';
                
                // Update UI to hide exit button
                game.updateUI();
            });

            // Handle No click
            exitConfirmNoBtn.addEventListener('click', () => {
                exitConfirmPopup.classList.remove('show');
            });
        } else if (!exitBtn) {
            console.error('CRITICAL: Exit button not found in DOM');
        }

        // Menu Logic
        const menuBtn = document.getElementById('menuBtn');
        const sideMenu = document.getElementById('sideMenu');
        const musicToggle = document.getElementById('musicToggle');
        const soundToggle = document.getElementById('soundToggle');

        if (menuBtn && sideMenu) {
            menuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                sideMenu.classList.toggle('open');
            });

            // Close menu when clicking outside
            document.addEventListener('click', (e) => {
                if (sideMenu.classList.contains('open') && 
                    !sideMenu.contains(e.target) && 
                    e.target !== menuBtn) {
                    sideMenu.classList.remove('open');
                }
            });
        }

        if (musicToggle) {
            musicToggle.checked = game.musicEnabled; 
            musicToggle.addEventListener('change', (e) => {
                game.toggleMusic(e.target.checked);
            });
        }

        if (soundToggle) {
            soundToggle.checked = game.soundEnabled;
            soundToggle.addEventListener('change', (e) => {
                game.toggleSound(e.target.checked);
            });
        }

        const bgToggle = document.getElementById('bgToggle');
        if (bgToggle) {
            bgToggle.checked = game.backgroundType === 'night';
            bgToggle.addEventListener('change', (e) => {
                game.setBackground(e.target.checked ? 'night' : 'morning');
            });
        }
        
        // Start the game initialization
        try {
            await game.start();
            console.log('Game initialized successfully');
        } catch (err) {
            console.error('Failed to start game:', err);
        }
    </script>
</body>

    }
