<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;900&display=swap" rel="stylesheet">
    <title>Breakout Game</title>
    <!-- Poki SDK -->
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Exo 2', Arial, sans-serif;
            overflow: hidden;
        }
        
        #gameContainer {
            border: 2px solid #fff;
            background-color: #111;
            position: relative;
            max-width: 100vw;
            max-height: 100vh;
            aspect-ratio: 4/3;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 18px;
            z-index: 2000;
            user-select: none;
            pointer-events: auto;
        }

        /* Hamburger Menu */
        #menuBtn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: white;
            font-size: 30px;
            cursor: pointer;
            z-index: 2002;
            padding: 5px;
            line-height: 1;
        }

        #sideMenu {
            position: fixed;
            top: 0;
            right: -300px;
            width: 300px;
            height: 100vh;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            border-left: 1px solid #333;
            transition: right 0.3s ease;
            z-index: 2001;
            padding: 60px 20px 20px;
            color: white;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            overflow-y: auto;
        }

        #sideMenu.open {
            right: 0;
        }

        .menu-section {
            margin-bottom: 30px;
        }

        .menu-title {
            font-size: 1.2em;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            margin-bottom: 15px;
            color: #1099bb;
            font-weight: bold;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #1099bb;
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        /* Menu Button */
        .menu-btn {
            background-color: #1099bb;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s;
        }
        
        .menu-btn:hover {
            background-color: #0d7a9a;
        }
        
    /* Level Select Screen */
    .level-screen-content {
        max-width: 620px !important;
        width: 92% !important;
        max-height: 85vh;
        overflow-y: auto;
        position: relative;
        background: linear-gradient(145deg, #0d1117 0%, #161b22 60%, #0d1117 100%) !important;
        border: 1px solid rgba(0, 212, 255, 0.3) !important;
        box-shadow: 0 0 40px rgba(0, 212, 255, 0.12), 0 20px 60px rgba(0,0,0,0.85) !important;
    }

    .level-screen-content h2 {
        font-family: 'Exo 2', Arial, sans-serif;
        font-weight: 900;
        font-size: 1.8em;
        text-transform: uppercase;
        letter-spacing: 4px;
        background: linear-gradient(90deg, #00d4ff, #a855f7, #00d4ff);
        background-size: 200%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: shimmer 3s linear infinite;
        margin: 0.3em 0 0.2em;
    }

    @keyframes shimmer {
        0%   { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
    }

    .close-icon {
        position: absolute;
        top: 12px;
        right: 15px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 50%;
        width: 32px;
        height: 32px;
        font-size: 1.3em;
        cursor: pointer;
        color: #666;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .close-icon:hover {
        background: rgba(244, 67, 54, 0.15);
        border-color: #f44336;
        color: #f44336;
    }

    #levelGrid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 12px;
        padding: 10px 20px 20px;
        margin-bottom: 10px;
    }
    
    /* Level Start Popup */
    .level-start-content {
        max-width: 420px;
        text-align: center;
        background: linear-gradient(145deg, #0d1117 0%, #161b22 100%) !important;
        border: 1px solid rgba(0, 212, 255, 0.3) !important;
        box-shadow: 0 0 40px rgba(0, 212, 255, 0.12), 0 20px 60px rgba(0,0,0,0.85) !important;
    }

    .level-start-content h2 {
        font-family: 'Exo 2', Arial, sans-serif;
        font-size: 3em;
        font-weight: 900;
        margin-bottom: 0.1em;
        color: #00d4ff;
        text-transform: uppercase;
        letter-spacing: 3px;
        animation: levelGlow 2s ease-in-out infinite alternate;
    }

    @keyframes levelGlow {
        from { text-shadow: 0 0 10px rgba(0, 212, 255, 0.5), 0 0 20px rgba(0, 212, 255, 0.2); }
        to   { text-shadow: 0 0 25px rgba(0, 212, 255, 1),   0 0 50px rgba(0, 212, 255, 0.5), 0 0 80px rgba(0, 212, 255, 0.2); }
    }

    .level-start-content p {
        font-family: 'Exo 2', Arial, sans-serif;
        font-size: 0.9em;
        font-weight: 600;
        color: #8892a4;
        margin-bottom: 1.8em;
        text-transform: uppercase;
        letter-spacing: 3px;
    }

    .popup-buttons {
        display: flex;
        justify-content: center;
        gap: 15px;
    }

    .confirm-btn {
        padding: 0.75em 1.8em;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-family: 'Exo 2', Arial, sans-serif;
        font-size: 0.9em;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.2s ease;
        color: white;
    }

    .confirm-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    .yes-btn {
        background: linear-gradient(135deg, #00b894, #00d4ff);
        box-shadow: 0 0 12px rgba(0, 212, 255, 0.3);
    }

    .no-btn {
        background: linear-gradient(135deg, #7c3aed, #a855f7);
        box-shadow: 0 0 12px rgba(124, 58, 237, 0.3);
    }
    
    .level-item {
        aspect-ratio: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 2px;
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.07);
        border-radius: 10px;
        font-family: 'Exo 2', Arial, sans-serif;
        font-size: 1em;
        font-weight: 700;
        color: rgba(255,255,255,0.18);
        cursor: not-allowed;
        transition: all 0.2s ease;
    }

    .level-item .level-icon {
        font-size: 0.7em;
        line-height: 1;
        opacity: 0.85;
    }

    .level-unlocked {
        cursor: pointer;
        background: rgba(0, 212, 255, 0.05);
        color: #c9d1d9;
        border-color: rgba(0, 212, 255, 0.3);
    }

    .level-unlocked:hover {
        transform: scale(1.08) translateY(-2px);
        background: rgba(0, 212, 255, 0.14);
        border-color: rgba(0, 212, 255, 0.8);
        box-shadow: 0 0 18px rgba(0, 212, 255, 0.35), 0 6px 20px rgba(0,0,0,0.4);
        color: #fff;
    }

    .level-completed {
        background: rgba(255, 215, 0, 0.07);
        color: #ffd700;
        border-color: rgba(255, 215, 0, 0.35);
    }

    .level-completed:hover {
        background: rgba(255, 215, 0, 0.16);
        border-color: rgba(255, 215, 0, 0.75);
        box-shadow: 0 0 18px rgba(255, 215, 0, 0.3), 0 6px 20px rgba(0,0,0,0.4);
    }

    .level-current {
        background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(124, 58, 237, 0.15));
        color: #fff;
        border-color: #00d4ff;
        animation: currentPulse 1.8s ease-in-out infinite;
    }

    @keyframes currentPulse {
        0%, 100% { box-shadow: 0 0 14px rgba(0, 212, 255, 0.45), 0 0 28px rgba(0, 212, 255, 0.15); }
        50%       { box-shadow: 0 0 24px rgba(0, 212, 255, 0.85), 0 0 48px rgba(0, 212, 255, 0.35); }
    }

    .level-locked {
        opacity: 0.35;
        background: rgba(255,255,255,0.01);
        border-color: rgba(255,255,255,0.05);
    }

        /* History List */
        #historyList {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
        }

        .history-win {
            border-left: 3px solid #4caf50;
        }

        .history-loss {
            border-left: 3px solid #f44336;
        }
        
        /* Responsive font sizing */
        @media (max-width: 768px) {
            #ui {
                font-size: 14px;
                top: 8px;
                left: 8px;
            }
        }
        
        @media (max-width: 480px) {
            #ui {
                font-size: 12px;
                top: 5px;
                left: 5px;
            }
        }
        
        /* Exit button styling */
        .exit-button {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 0.5em 1em;
            font-size: 0.9em;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 0.5em;
            transition: background-color 0.3s ease, transform 0.2s ease;
            font-weight: bold;
            pointer-events: auto;
            position: relative;
            z-index: 2001;
        }
        
        .exit-button:hover {
            background-color: #c82333;
            transform: translateY(-1px);
        }
        
        .exit-button:active {
            transform: translateY(0);
        }
        
        @media (max-width: 768px) {
            .exit-button {
                font-size: 0.8em;
                padding: 0.4em 0.8em;
            }
        }
        
        @media (max-width: 480px) {
            .exit-button {
                font-size: 0.7em;
                padding: 0.3em 0.6em;
            }
        }
        
        /* Ensure canvas scales properly */
        canvas {
            max-width: 100%;
            max-height: 100%;
            display: block;
            touch-action: none; /* Prevent scrolling and improve touch responsiveness */
            user-select: none; /* Prevent text selection */
            -webkit-user-select: none;
            -webkit-touch-callout: none; /* Disable callout on iOS */
        }
    </style>
</head>
<body>
    <div id="ui">
        <div>Score: <span id="score">0</span></div>
        <div>Lives: <span id="lives">3</span></div>
        <div>Level: <span id="level">1</span></div>
        <div>Username: <span id="username"></span></div>
        <button id="exitBtn" class="exit-button">Exit Game</button>
    </div>
    
    <button id="menuBtn">☰</button>
    
    <div id="sideMenu">
        <div class="menu-section">
            <div class="menu-title">Settings</div>
            <div class="setting-row">
                <span>Music</span>
                <label class="switch">
                    <input type="checkbox" id="musicToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-row">
                <span>Sound Effects</span>
                <label class="switch">
                    <input type="checkbox" id="soundToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-row">
                <span>Night Mode</span>
                <label class="switch">
                    <input type="checkbox" id="bgToggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
        
        <div class="menu-section">
            <div class="menu-title">Level Progress</div>
            <button id="levelSelectBtn" class="menu-btn">Select Level</button>
        </div>
        
        <div class="menu-section">
            <div class="menu-title">Game History</div>
            <ul id="historyList">
                <!-- History items will be added here -->
            </ul>
        </div>
    </div>

    <div id="gameContainer"></div>
    <!-- Username popup -->
    <div id="usernamePopup" class="popup show">
        <div class="popup-content">
            <h2>Welcome to Breakout!</h2>
            <p>Please enter your username:</p>
            <input type="text" id="usernameInput" placeholder="Enter your username" maxlength="20" />

            <button id="startGameBtn">Start Game</button>
        </div>
    </div>
    
    <!-- Popup overlay -->
    <div id="gamePopup" class="popup">
        <div class="popup-content">
            <h2 id="popupTitle"></h2>
            <p id="popupMessage"></p>
            <button id="popupOkBtn">OK</button>
        </div>
    </div>

    <!-- Exit Confirmation Popup -->
    <div id="exitConfirmPopup" class="popup">
        <div class="popup-content">
            <h2>Exit Game?</h2>
            <p>Are you sure you want to exit? Your progress will be lost.</p>
            <div class="popup-buttons">
                <button id="exitConfirmYesBtn" class="confirm-btn yes-btn">Yes, Exit</button>
                <button id="exitConfirmNoBtn" class="confirm-btn no-btn">Cancel</button>
            </div>
        </div>
    </div>
    <!-- Level Select Screen -->
    <div id="levelSelectScreen" class="popup">
        <div class="popup-content level-screen-content">
            <button id="closeLevelSelectIcon" class="close-icon">&times;</button>
            <h2>Select Level</h2>
            <div id="levelGrid">
                <!-- Levels will be generated here -->
            </div>
        </div>
    </div>

    <!-- Level Start Popup -->
    <div id="levelStartPopup" class="popup">
        <div class="popup-content level-start-content">
            <h2 id="levelStartTitle">Level 1</h2>
            <p>Get Ready!</p>
            <div class="popup-buttons">
                <button id="levelStartPlayBtn" class="confirm-btn yes-btn">Start Game</button>
                <button id="levelStartSelectBtn" class="confirm-btn no-btn">Select Level</button>
            </div>
        </div>
    </div>
    
    <script type="module">
        import { BreakoutGame } from './src/game.ts';
        
        console.log('Script module started');
        const game = new BreakoutGame();
        
        const startGameBtn = document.getElementById('startGameBtn');
        const usernameInput = document.getElementById('usernameInput');
        function startGame() {
            const username = usernameInput.value.trim();
            if (username) {
                game.username = username;
                const usernamePopup = document.getElementById('usernamePopup');
                if (usernamePopup) {
                    usernamePopup.classList.remove('show');
                }
                game.gameState = 'playing';
                if (game.app && game.app.ticker) {
                    game.app.ticker.start();
                }    
                game.initializeGame();
                game.updateUI(); 
            } else {
                alert('Please enter a username!');
            }
        } 
        if (startGameBtn) {
            startGameBtn.addEventListener('click', startGame);
        }
        if (usernameInput) {
            usernameInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    startGame();
                }
            });
        }
        const exitBtn = document.getElementById('exitBtn');
        const exitConfirmPopup = document.getElementById('exitConfirmPopup');
        const exitConfirmYesBtn = document.getElementById('exitConfirmYesBtn');
        const exitConfirmNoBtn = document.getElementById('exitConfirmNoBtn');

        if (exitBtn && exitConfirmPopup && exitConfirmYesBtn && exitConfirmNoBtn) {
            exitBtn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                exitConfirmPopup.classList.add('show');
            });

            // Handle Yes click
            exitConfirmYesBtn.addEventListener('click', () => {
                exitConfirmPopup.classList.remove('show');
                
                if (game.app && game.app.ticker) {
                    game.app.ticker.stop();
                }
                
                // Reset game state
                game.gameState = 'start';
                game.score = 0;
                game.lives = 3;
                
                // Show the username popup again
                const usernamePopup = document.getElementById('usernamePopup');
                if (usernamePopup) {
                    usernamePopup.classList.remove('hide');
                    usernamePopup.classList.add('show');
                }
                
                // Reset the game
                game.resetGame();
                
                // Force state back to start
                game.gameState = 'start';
                
                // Update UI to hide exit button
                game.updateUI();
            });

            // Handle No click
            exitConfirmNoBtn.addEventListener('click', () => {
                exitConfirmPopup.classList.remove('show');
            });
        } else if (!exitBtn) {
            console.error('CRITICAL: Exit button not found in DOM');
        }

        // Menu Logic
        const menuBtn = document.getElementById('menuBtn');
        const sideMenu = document.getElementById('sideMenu');
        const musicToggle = document.getElementById('musicToggle');
        const soundToggle = document.getElementById('soundToggle');

        if (menuBtn && sideMenu) {
            menuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                sideMenu.classList.toggle('open');
            });

            // Close menu when clicking outside
            document.addEventListener('click', (e) => {
                if (sideMenu.classList.contains('open') && 
                    !sideMenu.contains(e.target) && 
                    e.target !== menuBtn) {
                    sideMenu.classList.remove('open');
                }
            });
        }

        if (musicToggle) {
            musicToggle.checked = game.musicEnabled; 
            musicToggle.addEventListener('change', (e) => {
                game.toggleMusic(e.target.checked);
            });
        }

        if (soundToggle) {
            soundToggle.checked = game.soundEnabled;
            soundToggle.addEventListener('change', (e) => {
                game.toggleSound(e.target.checked);
            });
        }

        const bgToggle = document.getElementById('bgToggle');
        if (bgToggle) {
            bgToggle.checked = game.backgroundType === 'night';
            bgToggle.addEventListener('change', (e) => {
                game.setBackground(e.target.checked ? 'night' : 'morning');
            });
        }
        
        // Level Select Logic
        const levelSelectBtn = document.getElementById('levelSelectBtn');
        const levelSelectScreen = document.getElementById('levelSelectScreen');
        const closeLevelSelectIcon = document.getElementById('closeLevelSelectIcon');
        
        if (levelSelectBtn && levelSelectScreen && closeLevelSelectIcon) {
            levelSelectBtn.addEventListener('click', () => {
                game.openLevelSelect();
            });
            
            closeLevelSelectIcon.addEventListener('click', () => {
                game.closeLevelSelect();
            });
        }

        // Start the game initialization
        try {
            await game.start();
            console.log('Game initialized successfully');
        } catch (err) {
            console.error('Failed to start game:', err);
        }
    </script>
</body>

        transition: background-color 0.3s ease, transform 0.2s ease;

    #startGameBtn:hover {

    /* Responsive popup styles */
    @media (max-width: 768px) {
        .popup-content {
            padding: 2em 2.5em;
            min-width: 300px;
            width: 90vw;
            max-width: 400px;
        }
        
        #usernameInput {
            font-size: 0.9em;
            padding: 0.7em;
        }
        
        #startGameBtn {
            padding: 0.7em 1.5em;
            font-size: 1em;
